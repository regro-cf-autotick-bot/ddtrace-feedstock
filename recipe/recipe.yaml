schema_version: 1

context:
  version: "4.12.2"

package:
  name: ddtrace
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/ddtrace/ddtrace-${{ version }}.tar.gz
  sha256: a3cfa19ebd6b5c0f7c70c16da29d7bf5f50c0ab014ad3dc77e9c06a424ca2cfb
  patches:
    - patches/001-patch-out-cmake-build-dep.patch

build:
  number: 0
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
    - cd src/native
    - cargo-bundle-licenses --format yaml --output ../../THIRDPARTY.yml
  python:
    entry_points:
      - ddtrace-run = ddtrace.commands.ddtrace_run:main
      - _dd_crashtracker_receiver = ddtrace.commands._dd_crashtracker_receiver:main

requirements:
  build:
    - cargo-bundle-licenses
    - if: build_platform != target_platform
      then:
      - python
      - cross-python_${{ target_platform }}
      - setuptools-scm >=4
      - setuptools-rust <2
      - setuptools
      - cython
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ compiler('rust') }}
    - ${{ stdlib("c") }}
    - cmake >=3.24.2,<3.28
    - ninja
    - git
    - make
  host:
    - python
    - setuptools-scm >=4
    - cython
    - cmake >=3.24.2,<3.28
    - setuptools-rust <2
    - setuptools
    - pip
  run:
    - python
    - bytecode >=0.17.0
    - envier >=0.6.1,<1.dev0
    - opentelemetry-api >=1,<2
    - wrapt >=1,!=2.2.0,<3

tests:
  - python:
      imports:
        - ddtrace
  - script:
      - ddtrace-run --help

about:
  summary: Datadog APM client library
  license: 0BSD AND Apache-2.0 AND BSD-3-Clause
  homepage: https://github.com/DataDog/dd-trace-py
  documentation: https://ddtrace.readthedocs.io/en/stable/
  license_file:
    - LICENSE
    - LICENSE.BSD3
    - LICENSE.Apache
    - NOTICE
    - THIRDPARTY.yml

extra:
  recipe-maintainers:
    - aymondebroglie
    - SarvarD
    - mgorny
